name: Deploy Web Build to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4.6.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          # chickensoft-games/setup-godot@v2 installs only the editor,
          # not the export templates. Download and place them at the
          # path Godot's CLI looks for: ~/.local/share/godot/export_templates/<version>/
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.6.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -fsSL -o /tmp/templates.tpz "$TEMPLATE_URL"
          # .tpz is a zip; extract and move contents of the "templates/" root
          # into the version directory.
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          mv /tmp/templates_extracted/templates/* "$TEMPLATE_DIR/"
          ls "$TEMPLATE_DIR" | head

      - name: Cache .godot import folder
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd', 'project.godot') }}
          restore-keys: |
            godot-import-

      - name: Import project (first pass)
        run: godot --headless --import || true

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          # .nojekyll prevents Pages' Jekyll processor from stripping
          # files whose names start with an underscore.
          touch build/web/.nojekyll

      - name: List build output (sanity log)
        run: ls -lh build/web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
